<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jason Pearson - Client Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 14px; padding: 48px 40px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.logo { font-size: 48px; text-align: center; margin-bottom: 12px; }
h1 { font-family: 'Playfair Display', serif; font-size: 24px; text-align: center; margin-bottom: 6px; }
.sub { font-size: 13px; color: #666; text-align: center; margin-bottom: 28px; line-height: 1.5; }
input { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; outline: none; transition: border-color 0.15s; }
input:focus { border-color: #CC1F1F; }
button { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; padding: 13px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
.btn-red { background: #CC1F1F; color: white; }
.btn-red:hover { background: #9B1515; }
.btn-dark { background: #111; color: white; margin-top: 8px; }
.btn-dark:hover { background: #333; }
.btn-outline { background: none; border: 1px solid #ddd; color: #666; margin-top: 8px; font-size: 13px; padding: 10px; }
.btn-outline:hover { border-color: #CC1F1F; color: #CC1F1F; }
.msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
.msg.error { background: #FBF0F0; color: #CC1F1F; display: block; }
.msg.success { background: #EAF6EC; color: #276F35; display: block; }
.divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #CC1F1F; margin-bottom: 14px; }
.client-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; background: #f8f6f2; }
.client-item .info { flex: 1; }
.client-item .name { font-weight: 600; font-size: 14px; }
.client-item .detail { font-size: 12px; color: #888; margin-top: 2px; }
.copy-btn { background: #111; color: white; font-size: 11px; font-weight: 600; padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer; white-space: nowrap; width: auto; }
.del-btn { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; width: auto; padding: 0 4px; }
.del-btn:hover { color: #CC1F1F; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="main-card">

  <!-- CLIENT LOGIN -->
  <div id="view-login">
    <div class="logo">&#127968;</div>
    <h1>Jason Pearson</h1>
    <p class="sub">Your Neighborhood Real Estate Agent<br>Enter your portal credentials to continue</p>
    <input type="text" id="c-portal-id" placeholder="Portal ID (provided by Jason)" autocomplete="off">
    <input type="password" id="c-password" placeholder="Password" onkeydown="if(event.key==='Enter')clientLogin()">
    <button class="btn-red" onclick="clientLogin()">Enter My Portal</button>
    <div id="client-msg" class="msg"></div>
    <hr class="divider">
    <button class="btn-outline" onclick="showView('view-agent-login')">Agent Login</button>
  </div>

  <!-- AGENT LOGIN -->
  <div id="view-agent-login" class="hidden">
    <div class="logo">&#128274;</div>
    <h1>Agent Login</h1>
    <p class="sub">Jason Pearson &mdash; Carpenter Realtors</p>
    <input type="password" id="a-password" placeholder="Agent password" onkeydown="if(event.key==='Enter')agentLogin()">
    <button class="btn-red" onclick="agentLogin()">Login</button>
    <div id="agent-msg" class="msg"></div>
    <hr class="divider">
    <button class="btn-outline" onclick="showView('view-login')">&#8592; Back</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="view-admin" class="hidden">
    <h1 style="margin-bottom:4px;">Client Portals</h1>
    <p class="sub" style="margin-bottom:20px;">Create and manage client portals</p>

    <div class="section-title">Create New Portal</div>
    <input type="text" id="n-name" placeholder="Client name (e.g. Smith Family)">
    <input type="text" id="n-id" placeholder="Portal ID - no spaces (e.g. smith2025)">
    <input type="text" id="n-address" placeholder="Property address">
    <input type="text" id="n-password" placeholder="Client password">
    <button class="btn-red" onclick="createPortal()">Create Portal</button>
    <div id="create-msg" class="msg"></div>

    <hr class="divider">
    <div class="section-title">Active Portals</div>
    <div id="portal-list"><div style="font-size:13px;color:#888;text-align:center;">Loading...</div></div>

    <hr class="divider">
    <button class="btn-outline" onclick="agentLogout()">Log Out</button>
  </div>

</div>

<script>
const SB_URL = 'https://ojjakbevrooqeylzgaoz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qamFrYmV2cm9vcWV5bHpnYW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDU3MjksImV4cCI6MjA5MzYyMTcyOX0.MjyJpemIQgfzkAWWfdcc7KohPLPKqgLFTp33wZvmqlI';
const AGENT_PW = 'JasonPearson2025!';
const sb = supabase.createClient(SB_URL, SB_KEY);

function showView(id) {
  ['view-login','view-agent-login','view-admin'].forEach(function(v) {
    document.getElementById(v).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function showMsg(id, text, type) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

// Hash password
async function hashPw(pw) {
  var data = new TextEncoder().encode(pw + 'jp_salt_2025');
  var hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
}

// CLIENT LOGIN
async function clientLogin() {
  var portalId = document.getElementById('c-portal-id').value.trim().toLowerCase();
  var pw = document.getElementById('c-password').value;
  if (!portalId || !pw) { showMsg('client-msg', 'Please enter both Portal ID and password.', 'error'); return; }

  var hash = await hashPw(pw);
  var res = await sb.from('clients').select('*').eq('portal_id', portalId).single();

  if (res.error || !res.data) { showMsg('client-msg', 'Portal ID not found. Please check with Jason.', 'error'); return; }
  if (res.data.password_hash !== hash) { showMsg('client-msg', 'Incorrect password. Please try again.', 'error'); return; }

  sessionStorage.setItem('portal_client', JSON.stringify(res.data));
  window.location.href = 'portal.html';
}

// AGENT LOGIN
function agentLogin() {
  var pw = document.getElementById('a-password').value;
  if (pw === AGENT_PW) {
    showView('view-admin');
    loadPortals();
  } else {
    showMsg('agent-msg', 'Incorrect password.', 'error');
    document.getElementById('a-password').value = '';
  }
}

function agentLogout() {
  document.getElementById('a-password').value = '';
  showView('view-login');
}

// CREATE PORTAL
async function createPortal() {
  var name = document.getElementById('n-name').value.trim();
  var portalId = document.getElementById('n-id').value.trim().toLowerCase().replace(/\s+/g,'');
  var address = document.getElementById('n-address').value.trim();
  var pw = document.getElementById('n-password').value.trim();

  if (!name || !portalId || !pw) { showMsg('create-msg', 'Name, Portal ID and password are required.', 'error'); return; }

  var hash = await hashPw(pw);
  var res = await sb.from('clients').insert([{
    portal_id: portalId,
    client_name: name,
    property_address: address,
    password_hash: hash,
    agent_id: 'jason'
  }]).select().single();

  if (res.error) { showMsg('create-msg', 'Error: ' + res.error.message, 'error'); return; }

  showMsg('create-msg', 'Portal created! Share the link with your client.', 'success');
  document.getElementById('n-name').value = '';
  document.getElementById('n-id').value = '';
  document.getElementById('n-address').value = '';
  document.getElementById('n-password').value = '';
  loadPortals();
}

// LOAD PORTALS
async function loadPortals() {
  var res = await sb.from('clients').select('*').eq('agent_id', 'jason').order('created_at', {ascending: false});
  var container = document.getElementById('portal-list');
  if (res.error || !res.data || res.data.length === 0) {
    container.innerHTML = '<div style="font-size:13px;color:#888;text-align:center;">No portals yet. Create your first one above.</div>';
    return;
  }
  var base = window.location.href.replace('index.html','').replace(/\?.*$/,'');
  container.innerHTML = res.data.map(function(c) {
    var link = base + '?portal=' + c.portal_id;
    return '<div class="client-item">'
      + '<div class="info"><div class="name">' + (c.client_name||'Unnamed') + '</div>'
      + '<div class="detail">' + (c.property_address||'No address') + ' &nbsp;&middot;&nbsp; ID: <strong>' + c.portal_id + '</strong></div></div>'
      + '<button class="copy-btn" onclick="copyLink(\'' + link + '\')">Copy Link</button>'
      + '<button class="del-btn" onclick="deletePortal(\'' + c.id + '\')">&#10005;</button>'
      + '</div>';
  }).join('');
}

async function openClientPortal(clientId) {
  var res = await sb.from('clients').select('*').eq('id', clientId).single();
  if (res.error || !res.data) { alert('Could not load client data.'); return; }
  sessionStorage.setItem('portal_client', JSON.stringify(res.data));
  window.location.href = 'portal.html';
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(function() {
    alert('Link copied!\n\n' + url + '\n\nShare this with your client.');
  });
}

async function deletePortal(id) {
  if (!confirm('Delete this portal? This cannot be undone.')) return;
  await sb.from('clients').delete().eq('id', id);
  loadPortals();
}

// Auto-fill portal ID from URL
var params = new URLSearchParams(window.location.search);
if (params.get('portal')) {
  document.getElementById('c-portal-id').value = params.get('portal');
  document.getElementById('c-password').focus();
}
</script>
</body>
</html>
